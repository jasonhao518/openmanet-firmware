name: Build Firmware

on:
  workflow_call:
    inputs:
      board:
        description: 'Board name (e.g., ekh-bcm2711)'
        required: true
        type: string
      target:
        description: 'OpenWrt target platform (e.g., bcm27xx)'
        required: true
        type: string
      subtarget:
        description: 'OpenWrt subtarget (e.g., bcm2711)'
        required: true
        type: string
      description:
        description: 'Human-readable description of supported hardware'
        required: true
        type: string
      releasepackages:
        description: 'Upload built packages as artifacts for release publishing'
        required: false
        type: boolean
        default: false
      cpu_arch:
        description: 'CPU architecture directory name under bin/packages/ (e.g., aarch64_cortex-a72). Leave empty to skip arch package upload.'
        required: false
        type: string
        default: ''
      incremental_cache:
        description: 'Cache target package, kernel, and staging state for incremental builds'
        required: false
        type: boolean
        default: false
      exclude_wakaama:
        description: 'Exclude wakaama-server from the resolved firmware configuration'
        required: false
        type: boolean
        default: false
      base_openwrt_only:
        description: 'Build directly from the board target config without OpenMANET common configs'
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build ${{ inputs.board }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex g++ gawk gcc-multilib g++-multilib git gettext \
            libncurses5-dev libssl-dev python3-setuptools rsync unzip golang-go zlib1g-dev swig file wget libnl-3-dev \
            libnl-genl-3-dev libgps-dev libcap-dev pkg-config libopus-dev \
            libopusfile-dev portaudio19-dev net-tools libpcre3-dev libpcre3 squashfs-tools upx-ucl

      - name: Cache source archives
        uses: actions/cache@v5
        with:
          path: dl
          key: sources-v2-${{ runner.os }}-${{ hashFiles('feeds.conf.default', 'package/**/Makefile', 'target/linux/**/Makefile') }}
          restore-keys: |
            sources-v2-${{ runner.os }}-

      - name: Cache feed repositories
        uses: actions/cache@v5
        with:
          path: feeds
          # Include this workflow because the lite profile declares its
          # upstream LuCI pin here instead of in feeds.conf.default.
          key: feeds-v2-${{ runner.os }}-${{ hashFiles('feeds.conf.default', '.github/workflows/build-firmware.yml') }}

      - name: Cache host tools and target toolchain
        uses: actions/cache@v5
        with:
          path: |
            build_dir/host
            build_dir/toolchain-*
            staging_dir/host
            staging_dir/toolchain-*
          key: common-build-v1-${{ runner.os }}-${{ inputs.target }}-${{ inputs.subtarget }}-${{ hashFiles('toolchain/**', 'tools/**', 'include/**', 'config/**', 'rules.mk', 'boards/common/general_diffconfig') }}

      - name: Cache incremental firmware build state
        if: inputs.incremental_cache
        uses: actions/cache@v5
        with:
          path: |
            build_dir/target-*
            staging_dir/target-*
            staging_dir/packages
            bin/packages
          key: incremental-v1-${{ runner.os }}-${{ inputs.board }}-${{ inputs.target }}-${{ inputs.subtarget }}-${{ hashFiles('feeds.conf.default', 'toolchain/**', 'include/version.mk') }}-${{ github.sha }}
          restore-keys: |
            incremental-v1-${{ runner.os }}-${{ inputs.board }}-${{ inputs.target }}-${{ inputs.subtarget }}-${{ hashFiles('feeds.conf.default', 'toolchain/**', 'include/version.mk') }}-

      - name: Cache compiler objects
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-v1-${{ runner.os }}-${{ inputs.target }}-${{ inputs.subtarget }}-${{ hashFiles('toolchain/**', 'include/version.mk') }}-${{ github.sha }}
          restore-keys: |
            ccache-v1-${{ runner.os }}-${{ inputs.target }}-${{ inputs.subtarget }}-${{ hashFiles('toolchain/**', 'include/version.mk') }}-

      - name: Configure build for ${{ inputs.board }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.base_openwrt_only }}" == "true" ]]; then
            # Use upstream LuCI for this Morse-free recovery image. The
            # OpenMANET LuCI fork adds a morse-regdb dependency to luci-base.
            sed -n '/^src-git packages /p' feeds.conf.default > feeds.conf
            printf '%s\n' \
              'src-git luci https://github.com/openwrt/luci.git^65670be14f14bbdcd201c36f97f276fa60a93c6c' \
              >> feeds.conf
            ./scripts/feeds update packages luci
            ./scripts/feeds install -p packages cgi-io
            ./scripts/feeds install -p luci -a
            # Remove the full EdgeZ deployment defaults. The recovery profile
            # supplies its own small LAN/AP-only first-boot configuration.
            rm -f package/base-files/files/etc/uci-defaults/90-rpi5-remote-access
            cp "boards/${{ inputs.board }}/target_diffconfig" .config
          else
            # The feed cache is saved after board patches have been applied.
            # Restore every cached Git feed to its pinned revision before
            # applying the current patch series, otherwise a subsequent run
            # applies patches twice and can silently package .rej files.
            if [[ -d feeds ]]; then
              for feed_dir in feeds/*; do
                if [[ -d "$feed_dir/.git" ]]; then
                  git -C "$feed_dir" reset --hard HEAD
                  git -C "$feed_dir" clean -fd
                fi
              done
            fi
            ./scripts/openmanet_setup.sh -i -b ${{ inputs.board }}
          fi
          printf '%s\n' \
            'CONFIG_DEVEL=y' \
            'CONFIG_CCACHE=y' >> .config
          if [[ "${{ inputs.exclude_wakaama }}" == "true" ]]; then
            sed -i '/^CONFIG_PACKAGE_wakaama-server=/d' .config
            printf '%s\n' '# CONFIG_PACKAGE_wakaama-server is not set' >> .config
          fi
          make defconfig

          if [[ "${{ inputs.base_openwrt_only }}" == "true" ]]; then
            echo "=== Verifying base OpenWrt-only configuration ==="
            grep -qx 'CONFIG_TARGET_DEVICE_ramips_mt76x8_DEVICE_heltec_ht-h7608-v1-lite=y' .config
            grep -qx 'CONFIG_TARGET_ROOTFS_SQUASHFS=y' .config
            if grep -qx 'CONFIG_TARGET_ROOTFS_INITRAMFS=y' .config; then
              echo "Recovery profile unexpectedly resolved as an initramfs build" >&2
              exit 1
            fi
            for package in base-files busybox cgi-io dnsmasq dropbear firewall4 fstools \
              kmod-gpio-button-hotplug kmod-mt7603 mtd netifd procd ubus uci \
              wifi-scripts wireless-regdb wpad-basic-mbedtls luci-light \
              luci-base luci-mod-admin-full luci-mod-system luci-theme-bootstrap \
              rpcd rpcd-mod-file rpcd-mod-luci uhttpd uhttpd-mod-ubus; do
              if ! grep -Eq "^CONFIG_PACKAGE_${package}=y$" .config; then
                echo "Required base package is missing: ${package}" >&2
                exit 1
              fi
            done
            forbidden_packages=(
              kmod-morse netifd-morse morse-board-config morse-bundle
              morse-copy-coredump morse-fw morse-fw-6108 morse-regdb morsectrl
              alfred edgez-subnet-routes batctl-full kmod-batman-adv
              openmanetd luci-app-morseconfig luci-app-ekhwizards
            )
            for package in "${forbidden_packages[@]}"; do
              if grep -Eq "^CONFIG_PACKAGE_${package}=[ym]$" .config; then
                echo "Non-base package leaked into boot-test image: ${package}" >&2
                exit 1
              fi
            done
            test -f package/base-files/files/etc/uci-defaults/91-ht-h7608-lite-wifi
            grep -qx 'CONFIG_TARGET_PREINIT_IP="192.168.100.1"' .config
            grep -Fq "set network.lan.ipaddr='192.168.100.1'" \
              package/base-files/files/etc/uci-defaults/91-ht-h7608-lite-wifi
          fi

          if [[ "${{ inputs.board }}" == "rpi5-mm8108-usb" && "${{ inputs.exclude_wakaama }}" != "true" ]]; then
            echo "=== Verifying Raspberry Pi 5 Wakaama configuration ==="
            grep -E '^(CONFIG_TARGET_bcm27xx_bcm2712|CONFIG_PACKAGE_wakaama-server)=y$' .config
            test -f patches/rpi5-mm8108-usb/0006-luci-show-edgez-routing-in-mesh-topology.patch
            grep -Fq 'function get_edgez_routing()' \
              feeds/morse/features/morse_mesh11sd/files/usr/share/rpcd/ucode/meshvisualizer
            grep -Fq 'wifiRouter: routing?.wifi_router' \
              feeds/openmanet/luci/luci-mod-home/htdocs/luci-static/resources/view/home/mesh11s-topology.js
            grep -Fq 'target="_blank"' \
              feeds/openmanet/luci/luci-mod-home/htdocs/luci-static/resources/view/home/mesh11s-topology.js
            if ! grep -qx 'CONFIG_PACKAGE_wakaama-server=y' .config; then
              echo "wakaama-server was removed from the resolved OpenWrt configuration" >&2
              exit 1
            fi
          fi

          if [[ "${{ inputs.board }}" == "ht-hd01-v2" || "${{ inputs.board }}" == "ht-h7608-v1" ]]; then
            echo "=== Verifying Heltec EdgeZ mesh configuration ==="
            if [[ "${{ inputs.board }}" == "ht-h7608-v1" ]]; then
              target_device=CONFIG_TARGET_DEVICE_ramips_mt76x8_DEVICE_heltec_ht-h7608-v1
              board_compatible='heltec,ht-h7608-v1'
            else
              target_device=CONFIG_TARGET_DEVICE_ramips_mt76x8_DEVICE_heltec_ht-hd01-v2
              board_compatible='"heltec,ht-hd01-v2")'
            fi
            required_config=(
              "$target_device"
              CONFIG_PACKAGE_kmod-morse
              CONFIG_PACKAGE_netifd-morse
              CONFIG_PACKAGE_morse-fw-6108
              CONFIG_PACKAGE_morse-regdb
              CONFIG_PACKAGE_morse-board-config
              CONFIG_PACKAGE_morse_mesh11sd
              CONFIG_MORSE_SDIO
              CONFIG_MORSE_WPA_SUPPLICANT_S1G_MESH_NETWORKING
              CONFIG_PACKAGE_alfred
              CONFIG_PACKAGE_edgez-subnet-routes
              CONFIG_PACKAGE_batctl-full
              CONFIG_PACKAGE_kmod-batman-adv
              CONFIG_PACKAGE_ip-full
              CONFIG_PACKAGE_iperf
              CONFIG_PACKAGE_luci-base
              CONFIG_PACKAGE_luci-app-morseconfig
              CONFIG_PACKAGE_luci-mod-admin-full
              CONFIG_PACKAGE_luci-proto-batman-adv
              CONFIG_PACKAGE_uhttpd
              CONFIG_PACKAGE_wpad-openssl
            )
            for option in "${required_config[@]}"; do
              if ! grep -qx "${option}=y" .config; then
                echo "Required Heltec mesh option was removed: ${option}" >&2
                exit 1
              fi
            done
            if [[ "${{ inputs.board }}" == "ht-h7608-v1" ]]; then
              grep -qx 'CONFIG_PACKAGE_kmod-mt7603=y' .config
              grep -qx 'CONFIG_PACKAGE_morse-board-config=y' .config
              grep -Fq '/sbin/wifi config' \
                package/base-files/files/etc/uci-defaults/90-rpi5-remote-access
              grep -Fq 'derived_mesh_gateway_ip="10.41.${gateway_slot}.1"' \
                package/base-files/files/etc/uci-defaults/90-rpi5-remote-access
              grep -Fq "upstream_device='eth0.1'" \
                package/base-files/files/etc/uci-defaults/90-rpi5-remote-access
              grep -Fq "ap_network='wifi'" \
                package/base-files/files/etc/uci-defaults/90-rpi5-remote-access
              grep -Fq "morse_bcf='bcf_mf08551.bin'" \
                package/base-files/files/etc/uci-defaults/90-rpi5-remote-access
              grep -Fq 'wireless."$radio".bcf="$morse_bcf"' \
                package/base-files/files/etc/uci-defaults/90-rpi5-remote-access
              grep -Fq 'HT_HC01_BCF_ARCHIVE:=' \
                feeds/morse/essentials/mm-board-config/Makefile
              grep -Fq "uci.get('network', sectionId, 'ipaddr') ?? getRandomIpaddr(ip)" \
                feeds/openmanet/luci/luci-app-morseconfig/htdocs/luci-static/resources/tools/morse/uci.js
              grep -Fq "const upstreamNetwork = 'wan'" \
                feeds/openmanet/luci/luci-app-ekhwizards/htdocs/luci-static/resources/view/morse/meshwizard.js
              grep -Fq "uplink === 'none'" \
                feeds/openmanet/luci/luci-app-ekhwizards/htdocs/luci-static/resources/view/morse/meshwizard.js
              grep -Fq "vlanParents.has(deviceName)" \
                feeds/openmanet/luci/luci-app-morseconfig/htdocs/luci-static/resources/tools/morse/uci.js
              grep -Fq "uci.set('dhcp', dhcp, 'ignore', '1')" \
                feeds/openmanet/luci/luci-app-morseconfig/htdocs/luci-static/resources/tools/morse/uci.js
              grep -Fq "uci.set('network', wifiIface, 'netmask', '255.255.255.224')" \
                feeds/openmanet/luci/luci-app-ekhwizards/htdocs/luci-static/resources/view/morse/meshwizard.js
              grep -Fq "getOrCreateForwarding(wifiIface, halowIface, 'wifi_to_ahwlan', false)" \
                feeds/openmanet/luci/luci-app-ekhwizards/htdocs/luci-static/resources/view/morse/meshwizard.js
              grep -Fq "uci.set('network', 'bat0', 'mtu', '1400')" \
                feeds/openmanet/luci/luci-app-ekhwizards/htdocs/luci-static/resources/view/morse/meshwizard.js
              grep -Fq "uci.set('network', ahwlanBridge['.name'], 'mtu', '1400')" \
                feeds/openmanet/luci/luci-app-ekhwizards/htdocs/luci-static/resources/view/morse/meshwizard.js
              grep -Fq "uci.set('dhcp', wifiDhcp, 'ignore', '0')" \
                feeds/openmanet/luci/luci-app-ekhwizards/htdocs/luci-static/resources/view/morse/meshwizard.js
              grep -Fq "uci.set('network', wifiIface, 'force_link', '1')" \
                feeds/openmanet/luci/luci-app-ekhwizards/htdocs/luci-static/resources/view/morse/meshwizard.js
              grep -Fq "uci.set('firewall', section, 'masq_dest', ['!10.0.0.0/8'])" \
                feeds/openmanet/luci/luci-app-ekhwizards/htdocs/luci-static/resources/view/morse/meshwizard.js
              if find feeds/openmanet -type f \( -name '*.rej' -o -name '*.orig' \) -print -quit | grep -q .; then
                echo "Rejected or backup patch files found in the OpenMANET feed" >&2
                find feeds/openmanet -type f \( -name '*.rej' -o -name '*.orig' \) -print >&2
                exit 1
              fi
              test -x package/base-files/files/etc/uci-defaults/92-h7608-routing-fix
              grep -Fq "set_network_option switch0 enable_vlan 1" \
                package/base-files/files/etc/uci-defaults/92-h7608-routing-fix
              grep -Fq "[ \"\$mesh_gate_announcements\" = '0' ] && mesh_role='point'" \
                package/base-files/files/etc/uci-defaults/92-h7608-routing-fix
              grep -Fq 'set_network_option wifi ipaddr "$ap_ip"' \
                package/base-files/files/etc/uci-defaults/92-h7608-routing-fix
              grep -Fq "set_network_option bat0 mtu 1400" \
                package/base-files/files/etc/uci-defaults/92-h7608-routing-fix
              grep -Fq "uci -q set dhcp.ahwlan.ignore='1'" \
                package/base-files/files/etc/uci-defaults/92-h7608-routing-fix
              grep -Fq "set_network_option edgez_routes manage_default 1" \
                package/base-files/files/etc/uci-defaults/92-h7608-routing-fix
              grep -Fq "uci -q set firewall.ahwlan_to_wifi='forwarding'" \
                package/base-files/files/etc/uci-defaults/92-h7608-routing-fix
              test -f patches/ht-h7608-v1/0007-luci-show-edgez-routing-in-mesh-topology.patch
              grep -Fxq 'PKG_RELEASE:=2' \
                feeds/morse/features/morse_mesh11sd/Makefile
              grep -Fq 'function get_edgez_routing()' \
                feeds/morse/features/morse_mesh11sd/files/usr/share/rpcd/ucode/meshvisualizer
              grep -Fq 'wifiRouter: routing?.wifi_router' \
                feeds/openmanet/luci/luci-mod-home/htdocs/luci-static/resources/view/home/mesh11s-topology.js
              grep -Fq 'Current node' \
                feeds/openmanet/luci/luci-mod-home/htdocs/luci-static/resources/view/home/mesh11s-topology.js
              grep -Fq 'target="_blank"' \
                feeds/openmanet/luci/luci-mod-home/htdocs/luci-static/resources/view/home/mesh11s-topology.js
            fi
            grep -q "routing_algo', 'BATMAN_IV'" \
              feeds/openmanet/luci/luci-app-morseconfig/htdocs/luci-static/resources/tools/morse/uci.js
            test -f feeds/openmanet/drivers/morse_driver/patches/011-accept-ndp-addba-peer-capability.patch
            test -f package/kernel/mac80211/patches/subsys/402-accept-duplicate-offloaded-addba.patch
            grep -q "$board_compatible" \
              package/base-files/files/etc/uci-defaults/90-rpi5-remote-access
            grep -Fq "uci -q add_list alfred.alfred.interface='br-ahwlan'" \
              package/network/services/edgez-subnet-routes/files/99-edgez-routes
            grep -Fq "uci -q set alfred.alfred.disabled='0'" \
              package/network/services/edgez-subnet-routes/files/99-edgez-routes
            grep -Fq "status_snapshot(active, active_gateways, gateway_roles" \
              package/network/services/edgez-subnet-routes/files/edgez-subnet-routes.py
          fi

      - name: Download dependencies
        run: |
          make download -j$(nproc)

      - name: Build Raspberry Pi 5 Wakaama package
        if: inputs.board == 'rpi5-mm8108-usb' && inputs.exclude_wakaama == false
        shell: bash
        env:
          CCACHE_MAXSIZE: 3G
          CCACHE_COMPRESS: '1'
        run: |
          set -euo pipefail
          make package/network/services/wakaama-server/compile -j$(nproc) V=s

          wakaama_ipk=$(find bin/packages -type f \
            -name 'wakaama-server_*_aarch64_cortex-a76.ipk' -print -quit)
          if [[ -z "$wakaama_ipk" ]]; then
            echo "wakaama-server compiled without producing an aarch64_cortex-a76 IPK" >&2
            exit 1
          fi
          echo "Built $wakaama_ipk"

          control_dir=$(mktemp -d)
          tar -xzf "$wakaama_ipk" -C "$control_dir" ./control.tar.gz ./data.tar.gz
          tar -xzf "$control_dir/control.tar.gz" -C "$control_dir" ./control
          mkdir "$control_dir/root"
          tar -xzf "$control_dir/data.tar.gz" -C "$control_dir/root"
          echo "=== Generated Wakaama package metadata ==="
          sed -n '/^Package:/p;/^Version:/p;/^Depends:/p;/^Architecture:/p' \
            "$control_dir/control"

          test -x "$control_dir/root/usr/bin/lwm2mserver"
          test -f "$control_dir/root/usr/lib/libmosquitto.so.2.0.18"
          test -L "$control_dir/root/usr/lib/libmosquitto.so.1"

          required_ipk_dependencies=(
            libc libgcc libpthread libatomic libcares libuci libubox dbus libdbus
            avahi-dbus-daemon libavahi-client luci-base luci-compat
            luci-lua-runtime
          )
          depends=$(sed -n 's/^Depends: //p' "$control_dir/control")
          for package in "${required_ipk_dependencies[@]}"; do
            # OpenWrt appends ABI versions to library package names, for
            # example libatomic1 and libuci20250120.
            if ! grep -Eq "(^|, )${package}[0-9]*( \([^)]*\))?(,|$)" <<<"$depends"; then
              echo "Generated Wakaama IPK is missing dependency: ${package}" >&2
              exit 1
            fi
          done

      - name: Build firmware
        shell: bash
        env:
          CCACHE_MAXSIZE: 3G
          CCACHE_COMPRESS: '1'
        run: |
          set -euo pipefail
          make -j$(nproc) V=s 2>&1 | tee build.log
          echo "Build completed for ${{ inputs.board }}"

      - name: Show compiler cache statistics
        if: always()
        shell: bash
        run: |
          if [[ -x staging_dir/host/bin/ccache ]]; then
            staging_dir/host/bin/ccache --show-stats
          else
            echo "ccache is not available"
          fi

      - name: Check build output
        shell: bash
        run: |
          set -euo pipefail
          ls -lah bin/targets/${{ inputs.target }}/${{ inputs.subtarget }}/
          echo "=== Images created ==="
          find bin/targets/${{ inputs.target }}/${{ inputs.subtarget }}/ -name "*.img.gz" -o -name "*.bin"
          echo "=== Build info files ==="
          find bin/targets/${{ inputs.target }}/${{ inputs.subtarget }}/ -name "*.buildinfo"

          if [[ "${{ inputs.board }}" == "rpi5-mm8108-usb" && "${{ inputs.exclude_wakaama }}" != "true" ]]; then
            echo "=== Verifying Raspberry Pi 5 Wakaama packages ==="
            manifest=$(find bin/targets/${{ inputs.target }}/${{ inputs.subtarget }} \
              -maxdepth 1 -type f -name '*.manifest' | head -n1)
            if [[ -z "$manifest" ]]; then
              echo "Package manifest was not generated for ${{ inputs.target }}/${{ inputs.subtarget }}" >&2
              exit 1
            fi

            required_packages=(
              wakaama-server libc libgcc libpthread libatomic libcares libuci libubox dbus libdbus
              libavahi-client avahi-dbus-daemon luci-base luci-compat
              luci-lua-runtime
            )
            for package in "${required_packages[@]}"; do
              # ABI-versioned libraries are recorded as e.g. libuci20250120.
              if ! grep -Eq "^${package}[0-9]*([[:space:]]|$)" "$manifest"; then
                echo "Required Wakaama package is missing from firmware: ${package}" >&2
                exit 1
              fi
            done
            echo "Wakaama and all runtime dependencies are present in $manifest"
          fi

          if [[ "${{ inputs.board }}" == "ht-hd01-v2" || "${{ inputs.board }}" == "ht-h7608-v1" ]]; then
            echo "=== Verifying Heltec EdgeZ mesh packages ==="
            manifest=$(find bin/targets/${{ inputs.target }}/${{ inputs.subtarget }} \
              -maxdepth 1 -type f -name '*.manifest' | head -n1)
            if [[ -z "$manifest" ]]; then
              echo "Package manifest was not generated for ${{ inputs.target }}/${{ inputs.subtarget }}" >&2
              exit 1
            fi
            for package in kmod-morse netifd-morse morse-fw-6108 morse-regdb \
              morse-board-config morsecli morse_mesh11sd alfred \
              edgez-subnet-routes batctl-full kmod-batman-adv ip-full iperf \
              luci-base luci-app-morseconfig luci-mod-admin-full \
              luci-proto-batman-adv uhttpd wpad-openssl; do
              if ! grep -Eq "^${package}([[:space:]]|$)" "$manifest"; then
                echo "Required Heltec mesh package is missing from firmware: ${package}" >&2
                exit 1
              fi
            done
          fi

          if [[ "${{ inputs.board }}" == "ht-h7608-v1" || "${{ inputs.board }}" == "ht-h7608-v1-lite" ]]; then
            echo "=== Verifying HT-H7608 V1 image and embedded SquashFS ==="
            image=$(find bin/targets/${{ inputs.target }}/${{ inputs.subtarget }} \
              -maxdepth 1 -type f -name '*heltec_ht-h7608-v1*squashfs-sysupgrade.bin' -print -quit)
            if [[ -z "$image" ]]; then
              echo "HT-H7608 V1 sysupgrade image was not generated" >&2
              exit 1
            fi
            file "$image" | grep -q 'u-boot legacy uImage'
            rootfs_offset=$(LC_ALL=C grep -abo -m1 'hsqs' "$image" | cut -d: -f1)
            if [[ -z "$rootfs_offset" || "$rootfs_offset" -le 64 ]]; then
              echo "Could not locate the embedded SquashFS" >&2
              exit 1
            fi
            unsquashfs -s -o "$rootfs_offset" "$image"
            unsquashfs -ll -o "$rootfs_offset" "$image" >/dev/null
            echo "Validated complete SquashFS metadata at image offset $rootfs_offset"

            if [[ "${{ inputs.board }}" == "ht-h7608-v1" ]]; then
              bcf_file=$(mktemp)
              unsquashfs -cat -o "$rootfs_offset" "$image" \
                lib/firmware/morse/bcf_mf08551.bin > "$bcf_file"
              if [[ ! -s "$bcf_file" ]]; then
                echo "HT-HC01 V1 BCF (bcf_mf08551.bin) is missing from the image" >&2
                exit 1
              fi
              bcf_sha256=$(sha256sum "$bcf_file" | cut -d' ' -f1)
              if [[ "$bcf_sha256" != "57c50cb2c1d51187667677b392684285c616ddbf3fe262c3aeece342f446773e" ]]; then
                echo "Embedded bcf_mf08551.bin does not match the Heltec HT-HC01 V1 BCF" >&2
                exit 1
              fi
              echo "Validated embedded HT-HC01 V1 BCF: $bcf_sha256"
              rm -f "$bcf_file"

              mesh_backend=$(mktemp)
              mesh_frontend=$(mktemp)
              unsquashfs -cat -o "$rootfs_offset" "$image" \
                usr/share/rpcd/ucode/meshvisualizer > "$mesh_backend"
              unsquashfs -cat -o "$rootfs_offset" "$image" \
                www/luci-static/resources/view/home/mesh11s-topology.js > "$mesh_frontend"
              grep -Fq 'edgez_routing: get_edgez_routing()' "$mesh_backend"
              grep -Fq 'wifiRouter' "$mesh_frontend"
              grep -Fq 'Current node' "$mesh_frontend"
              grep -Fq 'target="_blank"' "$mesh_frontend"
              echo "Validated EdgeZ routing data and router links in the firmware image"
              rm -f "$mesh_backend" "$mesh_frontend"
            fi

            factory_pattern='*heltec_ht-h7608-v1*factory.bin'
            if [[ "${{ inputs.board }}" == "ht-h7608-v1-lite" ]]; then
              factory_pattern='*heltec_ht-h7608-v1-lite*factory.bin'
            fi
            factory_image=$(find bin/targets/${{ inputs.target }}/${{ inputs.subtarget }} \
              -maxdepth 1 -type f -name "$factory_pattern" -print -quit)
            if [[ -z "$factory_image" ]]; then
              echo "HT-H7608 V1 factory image was not generated" >&2
              exit 1
            fi
            file "$factory_image" | grep -q 'u-boot legacy uImage'
            test "$(stat -c '%s' "$factory_image")" -le 33226752
            echo "Validated U-Boot factory image: $factory_image"
          fi

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts/${{ inputs.board }}
          cp bin/targets/${{ inputs.target }}/${{ inputs.subtarget }}/*.img.gz artifacts/${{ inputs.board }}/ 2>/dev/null || true
          cp bin/targets/${{ inputs.target }}/${{ inputs.subtarget }}/*sysupgrade.bin artifacts/${{ inputs.board }}/ 2>/dev/null || true
          cp bin/targets/${{ inputs.target }}/${{ inputs.subtarget }}/*factory.bin artifacts/${{ inputs.board }}/ 2>/dev/null || true
          cp bin/targets/${{ inputs.target }}/${{ inputs.subtarget }}/sha256sums artifacts/${{ inputs.board }}/ 2>/dev/null || true
          echo "Board: ${{ inputs.board }}" > artifacts/${{ inputs.board }}/BOARD_INFO.txt
          echo "Description: ${{ inputs.description }}" >> artifacts/${{ inputs.board }}/BOARD_INFO.txt
          echo "Target: ${{ inputs.target }}/${{ inputs.subtarget }}" >> artifacts/${{ inputs.board }}/BOARD_INFO.txt
          echo "Build Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> artifacts/${{ inputs.board }}/BOARD_INFO.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ inputs.board }}
          path: artifacts/${{ inputs.board }}/*
          if-no-files-found: error
          retention-days: 5

      - name: Upload target packages
        if: inputs.releasepackages
        uses: actions/upload-artifact@v7
        with:
          name: packages-targets-${{ inputs.target }}--${{ inputs.subtarget }}
          path: bin/targets/${{ inputs.target }}/${{ inputs.subtarget }}/packages/
          if-no-files-found: warn
          retention-days: 1

      - name: Upload arch packages
        if: inputs.releasepackages && inputs.cpu_arch != ''
        uses: actions/upload-artifact@v7
        with:
          name: packages-arch-${{ inputs.cpu_arch }}
          path: bin/packages/${{ inputs.cpu_arch }}/
          if-no-files-found: warn
          retention-days: 1

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ inputs.board }}
          path: build.log
          retention-days: 30
