name: Build Firmware

on:
  workflow_call:
    inputs:
      board:
        description: 'Board name (e.g., ekh-bcm2711)'
        required: true
        type: string
      target:
        description: 'OpenWrt target platform (e.g., bcm27xx)'
        required: true
        type: string
      subtarget:
        description: 'OpenWrt subtarget (e.g., bcm2711)'
        required: true
        type: string
      description:
        description: 'Human-readable description of supported hardware'
        required: true
        type: string
      releasepackages:
        description: 'Upload built packages as artifacts for release publishing'
        required: false
        type: boolean
        default: false
      cpu_arch:
        description: 'CPU architecture directory name under bin/packages/ (e.g., aarch64_cortex-a72). Leave empty to skip arch package upload.'
        required: false
        type: string
        default: ''
      incremental_cache:
        description: 'Cache target package, kernel, and staging state for incremental builds'
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build ${{ inputs.board }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex g++ gawk gcc-multilib g++-multilib git gettext \
            libncurses5-dev libssl-dev python3-setuptools rsync unzip golang-go zlib1g-dev swig file wget libnl-3-dev \
            libnl-genl-3-dev libgps-dev libcap-dev pkg-config libopus-dev \
            libopusfile-dev portaudio19-dev net-tools libpcre3-dev libpcre3 upx-ucl

      - name: Cache source archives
        uses: actions/cache@v5
        with:
          path: dl
          key: sources-v2-${{ runner.os }}-${{ hashFiles('feeds.conf.default', 'package/**/Makefile', 'target/linux/**/Makefile') }}
          restore-keys: |
            sources-v2-${{ runner.os }}-

      - name: Cache feed repositories
        uses: actions/cache@v5
        with:
          path: feeds
          key: feeds-v1-${{ runner.os }}-${{ hashFiles('feeds.conf.default') }}

      - name: Cache host tools and target toolchain
        uses: actions/cache@v5
        with:
          path: |
            build_dir/host
            build_dir/toolchain-*
            staging_dir/host
            staging_dir/toolchain-*
          key: common-build-v1-${{ runner.os }}-${{ inputs.target }}-${{ inputs.subtarget }}-${{ hashFiles('toolchain/**', 'tools/**', 'include/**', 'config/**', 'rules.mk', 'boards/common/general_diffconfig') }}

      - name: Cache incremental firmware build state
        if: inputs.incremental_cache
        uses: actions/cache@v5
        with:
          path: |
            build_dir/target-*
            staging_dir/target-*
            staging_dir/packages
            bin/packages
          key: incremental-v1-${{ runner.os }}-${{ inputs.board }}-${{ inputs.target }}-${{ inputs.subtarget }}-${{ hashFiles('feeds.conf.default', 'toolchain/**', 'include/version.mk') }}-${{ github.sha }}
          restore-keys: |
            incremental-v1-${{ runner.os }}-${{ inputs.board }}-${{ inputs.target }}-${{ inputs.subtarget }}-${{ hashFiles('feeds.conf.default', 'toolchain/**', 'include/version.mk') }}-

      - name: Cache compiler objects
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-v1-${{ runner.os }}-${{ inputs.target }}-${{ inputs.subtarget }}-${{ hashFiles('toolchain/**', 'include/version.mk') }}-${{ github.sha }}
          restore-keys: |
            ccache-v1-${{ runner.os }}-${{ inputs.target }}-${{ inputs.subtarget }}-${{ hashFiles('toolchain/**', 'include/version.mk') }}-

      - name: Configure build for ${{ inputs.board }}
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/openmanet_setup.sh -i -b ${{ inputs.board }}
          printf '%s\n' \
            'CONFIG_DEVEL=y' \
            'CONFIG_CCACHE=y' >> .config
          make defconfig

      - name: Download dependencies
        run: |
          make download -j$(nproc)

      - name: Build firmware
        shell: bash
        env:
          CCACHE_MAXSIZE: 3G
          CCACHE_COMPRESS: '1'
        run: |
          set -o pipefail
          make -j$(nproc) V=s 2>&1 | tee build.log
          echo "Build completed for ${{ inputs.board }}"

      - name: Show compiler cache statistics
        if: always()
        shell: bash
        run: |
          if [[ -x staging_dir/host/bin/ccache ]]; then
            staging_dir/host/bin/ccache --show-stats
          else
            echo "ccache is not available"
          fi

      - name: Check build output
        shell: bash
        run: |
          set -euo pipefail
          ls -lah bin/targets/${{ inputs.target }}/${{ inputs.subtarget }}/
          echo "=== Images created ==="
          find bin/targets/${{ inputs.target }}/${{ inputs.subtarget }}/ -name "*.img.gz" -o -name "*.bin"
          echo "=== Build info files ==="
          find bin/targets/${{ inputs.target }}/${{ inputs.subtarget }}/ -name "*.buildinfo"

          if [[ "${{ inputs.board }}" == "rpi5-mm8108-usb" ]]; then
            echo "=== Verifying Raspberry Pi 5 Wakaama packages ==="
            manifest=$(find bin/targets/${{ inputs.target }}/${{ inputs.subtarget }} \
              -maxdepth 1 -type f -name '*.manifest' | head -n1)
            if [[ -z "$manifest" ]]; then
              echo "Package manifest was not generated for ${{ inputs.target }}/${{ inputs.subtarget }}" >&2
              exit 1
            fi

            required_packages=(
              wakaama-server libatomic1 libcares libuci libubox dbus libdbus
              libavahi-client avahi-dbus-daemon luci-base luci-compat
              luci-lua-runtime
            )
            for package in "${required_packages[@]}"; do
              # ABI-versioned libraries are recorded as e.g. libuci20250120.
              if ! grep -Eq "^${package}[0-9]*([[:space:]]|$)" "$manifest"; then
                echo "Required Wakaama package is missing from firmware: ${package}" >&2
                exit 1
              fi
            done
            echo "Wakaama and all runtime dependencies are present in $manifest"
          fi

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts/${{ inputs.board }}
          cp bin/targets/${{ inputs.target }}/${{ inputs.subtarget }}/*.img.gz artifacts/${{ inputs.board }}/ 2>/dev/null || true
          cp bin/targets/${{ inputs.target }}/${{ inputs.subtarget }}/*sysupgrade.bin artifacts/${{ inputs.board }}/ 2>/dev/null || true
          cp bin/targets/${{ inputs.target }}/${{ inputs.subtarget }}/sha256sums artifacts/${{ inputs.board }}/ 2>/dev/null || true
          echo "Board: ${{ inputs.board }}" > artifacts/${{ inputs.board }}/BOARD_INFO.txt
          echo "Description: ${{ inputs.description }}" >> artifacts/${{ inputs.board }}/BOARD_INFO.txt
          echo "Target: ${{ inputs.target }}/${{ inputs.subtarget }}" >> artifacts/${{ inputs.board }}/BOARD_INFO.txt
          echo "Build Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> artifacts/${{ inputs.board }}/BOARD_INFO.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ inputs.board }}
          path: artifacts/${{ inputs.board }}/*
          if-no-files-found: error
          retention-days: 5

      - name: Upload target packages
        if: inputs.releasepackages
        uses: actions/upload-artifact@v7
        with:
          name: packages-targets-${{ inputs.target }}--${{ inputs.subtarget }}
          path: bin/targets/${{ inputs.target }}/${{ inputs.subtarget }}/packages/
          if-no-files-found: warn
          retention-days: 1

      - name: Upload arch packages
        if: inputs.releasepackages && inputs.cpu_arch != ''
        uses: actions/upload-artifact@v7
        with:
          name: packages-arch-${{ inputs.cpu_arch }}
          path: bin/packages/${{ inputs.cpu_arch }}/
          if-no-files-found: warn
          retention-days: 1

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ inputs.board }}
          path: build.log
          retention-days: 30
