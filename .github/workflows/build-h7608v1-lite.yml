name: Build Wi-Fi Recovery OpenWrt on HT-H7608 V1

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  build-h7608-v1-lite:
    name: Build HT-H7608 V1 Wi-Fi recovery image
    uses: ./.github/workflows/build-firmware.yml
    with:
      board: ht-h7608-v1-lite
      target: ramips
      subtarget: mt76x8
      description: "Heltec HT-H7608 V1 OpenWrt recovery AP (MT7603 only; no Morse or OpenMANET services)"
      base_openwrt_only: true
