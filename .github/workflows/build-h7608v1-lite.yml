name: Build Base OpenWrt on HT-H7608 V1

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  build-h7608-v1-lite:
    name: Build HT-H7608 V1 base OpenWrt boot test
    uses: ./.github/workflows/build-firmware.yml
    with:
      board: ht-h7608-v1-lite
      target: ramips
      subtarget: mt76x8
      description: "Heltec HT-H7608 V1 base OpenWrt boot test (no radios or OpenMANET services)"
      base_openwrt_only: true
